<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>शाळा आणि महाविद्यालये</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>शाळा आणि महाविद्यालयांची यादी</h1>
  </header>

  <main>
    <div class="slider">
      <button class="nav-btn left" onclick="moveSlide(-1)">❮</button>

      <div class="slides">
        <div class="slide">
          <img src="collage.jpeg" alt="मानदेश महाविद्यालय जुनोनी">
          <p>मानदेश महाविद्यालय जुनोनी</p>
        </div>
        <div class="slide">
          <img src="school1.jpeg" alt="जि. प. शाळा श्रीरामवास्ती">
          <p>जि. प. शाळा श्रीरामवास्ती</p>
        </div>
        <div class="slide">
          <img src="2 school.jpeg" alt="जुनोनी विद्यालय व ज्युनियर कॉलेज जुनोनी">
          <p></p>जुनोनी विद्यालय व ज्युनियर कॉलेज जुनोनी
        </div>
      </div>

      <button class="nav-btn right" onclick="moveSlide(1)">❯</button>
    </div>
  </main>

  <footer>
    <p>© २०२५ जुनोनी ग्रामपंचायत. सर्व हक्क राखीव.</p>
  </footer>

  <script src="schole.js"></script>
</body>
</html>
